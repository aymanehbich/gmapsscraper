name: Google Maps Cloud Scraper & Outreach Pipeline

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Target Niche (e.g. Plumber, Electrician, Dentist)"
        required: true
        default: "Plumber"
      city:
        description: "Target City (e.g. Austin, Lyon, Casablanca) or leave blank for all"
        required: false
        default: "Austin"
      depth:
        description: "Scroll Depth (items to fetch)"
        required: false
        default: "20"
      enrich_emails:
        description: "Crawl websites to find contact emails?"
        type: boolean
        default: true
      send_to_n8n:
        description: "Auto-push scraped leads to n8n email pipeline?"
        type: boolean
        default: true
      service:
        description: "Service Offer Key (e.g. web_design, local_seo, reputation, ai_automation)"
        required: false
        default: "web_design"
      custom_subject:
        description: "Custom Email Subject Line (Optional override)"
        required: false
        default: ""
      custom_pitch:
        description: "Custom Email Pitch / Body text (Optional override)"
        required: false
        default: ""
      demo_link:
        description: "Custom Demo or Portfolio URL (Optional override)"
        required: false
        default: ""

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Scraper Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 3. Install Python Dependencies
        run: pip install -r requirements.txt

      - name: 4. Pull Google Maps Scraper Docker Image
        run: docker pull gosom/google-maps-scraper:latest

      - name: 5. Load Proxies (if set in GitHub Secrets)
        if: env.PROXIES_SECRET != ''
        env:
          PROXIES_SECRET: ${{ secrets.PROXIES_TXT }}
        run: echo "$PROXIES_SECRET" > proxies.txt

      - name: 6. Clean Old Output Directories
        run: |
          echo "Cleaning previous output files..."
          rm -rf output
          mkdir -p output

      - name: 7. Run Google Maps Scraper Orchestrator
        run: |
          set -e
          CMD="python run_scraper.py --niche \"${{ inputs.niche }}\" --depth ${{ inputs.depth }}"
          if [ -n "${{ inputs.city }}" ]; then
            CMD="$CMD --city \"${{ inputs.city }}\""
          fi
          if [ "${{ inputs.enrich_emails }}" = "true" ]; then
            CMD="$CMD --enrich-emails"
          fi
          if [ -f "proxies.txt" ] && [ -s "proxies.txt" ]; then
            CMD="$CMD --proxy-file proxies.txt"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: 8. Push Slim Leads from THIS RUN to n8n Webhook
        if: ${{ inputs.send_to_n8n == true || inputs.send_to_n8n == 'true' }}
        run: |
          python -c "
          import json, os, glob, requests
          try:
              from modules.email_validator import filter_valid_emails
          except ImportError:
              from email_validator import filter_valid_emails

          lead_files = glob.glob('output/**/cleaned_leads.json', recursive=True)
          all_leads = []
          for f in lead_files:
              with open(f, 'r', encoding='utf-8') as fh:
                  data = json.load(fh)
                  if isinstance(data, list):
                      all_leads.extend(data)

          print(f'Total leads scraped in this run: {len(all_leads)}')

          # Filter and slim
          slim_leads = []
          for lead in all_leads:
              raw_emails = lead.get('emails', [])
              if not raw_emails and lead.get('email'):
                  raw_emails = [lead.get('email')]
              
              valid_emails = filter_valid_emails(raw_emails)
              if not valid_emails:
                  continue

              slim_leads.append({
                  'cid': lead.get('cid') or lead.get('placeId') or lead.get('title'),
                  'title': lead.get('title'),
                  'category': lead.get('category') or '${{ inputs.niche }}',
                  'service': '${{ inputs.service }}',
                  'custom_subject': '''${{ inputs.custom_subject }}''',
                  'custom_pitch': '''${{ inputs.custom_pitch }}''',
                  'demo_link': '${{ inputs.demo_link }}',
                  'emails': valid_emails,
                  'website': lead.get('website'),
                  'city': lead.get('city') or '${{ inputs.city }}',
                  'state': lead.get('state'),
                  'country': lead.get('country'),
                  'phone': lead.get('phone')
              })

          print(f'Valid leads with deliverable emails ready for n8n: {len(slim_leads)}')

          if slim_leads:
              webhook_url = 'https://aymane-hbich-n8n-c2967382a5d9.herokuapp.com/webhook/leads'
              res = requests.post(webhook_url, json=slim_leads)
              print(f'n8n Webhook Response: {res.status_code} - {res.text}')
          else:
              print('No valid leads with emails found in this run.')
          "

      - name: 9. Save Leads as GitHub Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: gmaps-leads-${{ inputs.niche }}-${{ inputs.city }}
          path: output/
